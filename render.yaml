services:
  - type: web
    name: gitorbit-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DB_NAME
        value: github_analytics
      - key: SYNC_INTERVAL_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        value: http://localhost:3000,https://git-orbit.vercel.app
